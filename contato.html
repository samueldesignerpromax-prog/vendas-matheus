<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Matheus Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">✨ Matheus<span>Store</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="contact-hero">
            <div class="container">
                <h1>📱 Fale Comigo</h1>
                <div class="contact-grid">
                    <div class="contact-form">
                        <h3>Envie uma mensagem</h3>
                        <form id="contactForm">
                            <input type="text" id="nome" placeholder="Seu nome" required>
                            <input type="email" id="email" placeholder="Seu e-mail">
                            <textarea id="mensagem" rows="5" placeholder="Sua mensagem..." required></textarea>
                            <button type="submit" class="btn-primary">Enviar mensagem</button>
                        </form>
                    </div>
                    <div class="contact-info">
                        <h3>Redes Sociais</h3>
                        <a href="https://wa.me/5511999999999?text=Olá%20Matheus,%20vim%20do%20site!" target="_blank" class="contact-btn whatsapp">
                            💬 WhatsApp (Clique aqui)
                        </a>
                        <a href="https://instagram.com/matheus_store" target="_blank" class="contact-btn instagram">
                            📸 Instagram
                        </a>
                        <div class="contact-tip">
                            <p>💡 Dica: Me chame no WhatsApp para receber <strong>cupons exclusivos</strong> e ofertas relâmpago!</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Matheus Store - Links oficiais da Shopee</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
